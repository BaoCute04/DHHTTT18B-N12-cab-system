# Local dev stack (bridge). Bước chạy:
#   cp .env.docker.example .env.docker
#   docker compose up --build -d
#
# Cổng container thống nhất 3000; map host 3000–3009 như dưới.
# Broker dùng Kafka (đúng platform/node/broker.js), không dùng RabbitMQ.
name: dhhttt18b-n12-cab-system

services:
  api-gateway:
    build:
      context: .
      dockerfile: gateway/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: "3000"
      JWT_ISSUER: cab-auth-service
      JWT_AUDIENCE: cab-api
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3000
      RIDE_SERVICE_URL: http://ride-service:3000
      PRICING_SERVICE_URL: http://pricing-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      REVIEW_SERVICE_URL: http://review-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      - auth-service
      - user-service
      - booking-service
      - driver-service
      - payment-service
      - notification-service
      - pricing-service
      - review-service
      - ride-service

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: "3000"
      SERVICE_NAME: auth-service
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: "5432"
      AUTH_DB_USER: postgres
      AUTH_DB_PASSWORD: postgres
      AUTH_DB_NAME: cab_auth
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: "6379"
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:3000
      USER_SERVICE_BASE_URL: http://user-service:3000
      DRIVER_SERVICE_BASE_URL: http://driver-service:3000
      AUTH_JWT_ISSUER: cab-auth-service
      AUTH_JWT_AUDIENCE: cab-api
      AUTH_BOOTSTRAP_ADMIN_EMAIL: admin@cab.local
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
    depends_on:
      - postgres
      - redis

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH_JWKS_URI: http://auth-service:3000/.well-known/jwks.json
      AUTH_JWT_ISSUER: cab-auth-service
      AUTH_JWT_AUDIENCE: cab-api
    depends_on:
      - auth-service

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      KAFKA_BROKERS: kafka:19092
    depends_on:
      - kafka

  driver-service:
    build: ./services/driver-service
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      KAFKA_BROKERS: kafka:19092
    depends_on:
      - kafka

  notification-service:
    build: ./services/notification-service
    ports:
      - "3006:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    ports:
      - "3007:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      KAFKA_BROKERS: kafka:19092
    depends_on:
      - kafka

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    ports:
      - "3008:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      KAFKA_BROKERS: kafka:19092
    depends_on:
      - kafka

  ride-service:
    build: ./services/ride-service
    ports:
      - "3009:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      RIDE_ABAC_ASSIGNED_DRIVER_SUBJECT_ID: ${RIDE_ABAC_ASSIGNED_DRIVER_SUBJECT_ID:-driver-1}

  # Bitnami đã gỡ image public; dùng apache/kafka (KRaft). Trong mạng Docker: kafka:19092; từ máy host: localhost:9092.
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - cab_kafka_data:/tmp/kraft-combined-logs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cab_auth
    ports:
      - "5432:5432"
    volumes:
      - cab_postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - cab_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - cab_redis_data:/data

volumes:
  cab_postgres_data:
  cab_mongo_data:
  cab_redis_data:
  cab_kafka_data:
