openapi: 3.0.3
info:
  title: CAB Auth Service API (Gateway Contract)
  version: 0.2.0
  description: |
    Public contract for auth endpoints exposed through `api-gateway` at `/auth/*`.
    This version includes OAuth alias endpoints, `/auth/me`, JWT bundle claims
    (`scope`, `permissions`), and phase-7 failure policy expectations.
servers:
  - url: http://localhost:3000/auth
tags:
  - name: Health
  - name: OTP
  - name: Admin
  - name: Session
  - name: Keys
paths:
  /health:
    get:
      tags: [Health]
      summary: Auth service health
      responses:
        "200":
          description: Healthy
        "503":
          description: Degraded (dependency unavailable)
  /login/otp/request:
    post:
      tags: [OTP]
      summary: Request OTP
      responses:
        "202":
          description: OTP accepted
        "429":
          description: OTP throttled
        "503":
          description: Redis unavailable (fail-closed)
  /login/otp/verify:
    post:
      tags: [OTP]
      summary: Verify OTP and issue token pair
      responses:
        "200":
          description: OTP verified
        "400":
          description: Invalid OTP
        "423":
          description: OTP temporarily locked
        "503":
          description: Redis unavailable (fail-closed)
  /login/admin:
    post:
      tags: [Admin]
      summary: Admin password stage (returns MFA challenge only)
      responses:
        "200":
          description: Password accepted, MFA required
        "401":
          description: Invalid credentials
        "423":
          description: Admin account temporarily locked
        "503":
          description: Auth DB unavailable (fail-closed)
  /mfa/challenge:
    post:
      tags: [Admin]
      summary: Complete MFA challenge and issue token pair
      responses:
        "200":
          description: MFA completed and tokens issued
        "401":
          description: Invalid challenge or MFA code
        "503":
          description: Auth DB unavailable (fail-closed)
  /refresh:
    post:
      tags: [Session]
      summary: Rotate refresh token and issue new token pair
      responses:
        "200":
          description: Rotation success
        "401":
          description: Invalid or reused refresh token
        "503":
          description: DB/Redis unavailable (fail-closed)
  /oauth/token:
    post:
      tags: [Session]
      summary: OAuth alias for refresh (`grant_type=refresh_token`)
      responses:
        "200":
          description: Rotation success
        "401":
          description: Invalid or reused refresh token
        "503":
          description: DB/Redis unavailable (fail-closed)
  /logout:
    post:
      tags: [Session]
      summary: Revoke current refresh family/session
      responses:
        "200":
          description: Session revoked
        "503":
          description: DB/Redis unavailable (fail-closed)
  /oauth/revoke:
    post:
      tags: [Session]
      summary: OAuth alias for revoke/logout by refresh token
      responses:
        "200":
          description: Session revoked
        "503":
          description: DB/Redis unavailable (fail-closed)
  /logout-all:
    post:
      tags: [Session]
      summary: Revoke all sessions for account inferred by refresh token
      responses:
        "200":
          description: All sessions revoked
        "503":
          description: DB/Redis unavailable (fail-closed)
  /auth/me:
    get:
      tags: [Session]
      summary: Resolve auth context from Bearer token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auth context for current token
        "401":
          description: Missing/invalid access token
        "503":
          description: DB unavailable (fail-closed)
  /.well-known/jwks.json:
    get:
      tags: [Keys]
      summary: Retrieve JWKS for JWT verification
      responses:
        "200":
          description: JWKS document
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
