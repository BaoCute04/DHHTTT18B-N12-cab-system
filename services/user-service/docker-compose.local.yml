services:
  api-gateway:
    build:
      context: ../..
      dockerfile: gateway/api-gateway/Dockerfile
    container_name: cab-api-gateway
    env_file:
      - ../../gateway/api-gateway/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_started
      pricing-service:
        condition: service_started
      review-service:
        condition: service_started
      driver-service:
        condition: service_started

  pricing-service:
    build:
      context: ../..
      dockerfile: services/pricing-service/Dockerfile
    container_name: cab-pricing-service
    env_file:
      - ../pricing-service/.env.docker
    ports:
      - "3101:3101"
    depends_on:
      mongodb:
        condition: service_started

  review-service:
    build:
      context: ../..
      dockerfile: services/review-service/Dockerfile
    container_name: cab-review-service
    env_file:
      - ../review-service/.env.docker
    ports:
      - "3106:3106"

  driver-service:
    build:
      context: ../..
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-driver-service
    env_file:
      - ../driver-service/.env.docker
    ports:
      - "3107:3107"
    depends_on:
      mongodb:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: cab-pricing-mongodb
    ports:
      - "27017:27017"
    volumes:
      - cab_pricing_mongodb_data:/data/db

  postgres:
    image: postgres:16-alpine
    container_name: cab-user-postgres
    environment:
      POSTGRES_DB: cab_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cab_user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: cab-user-service
    env_file:
      - .env.docker
    ports:
      - "3105:3105"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cab_user_postgres_data:
  cab_pricing_mongodb_data:
