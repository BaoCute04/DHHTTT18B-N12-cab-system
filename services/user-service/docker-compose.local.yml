services:
  postgres:
    image: postgres:16-alpine
    container_name: cab-user-postgres
    environment:
      POSTGRES_DB: cab_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cab_user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: cab-user-service
    env_file:
      - .env.docker
    ports:
      - "3105:3105"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cab_user_postgres_data:
