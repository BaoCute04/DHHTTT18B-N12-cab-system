services:
  admin-dashboard:
    image: ${REGISTRY}/admin-dashboard:${IMAGE_TAG}
    networks:
      - edge-net
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_PUBLIC_URL}
    ports:
      - target: 80
        published: ${ADMIN_DASHBOARD_PORT}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${ADMIN_DASHBOARD_REPLICAS}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == edge
        preferences:
          - spread: node.labels.region

  customer-app:
    image: ${REGISTRY}/customer-app:${IMAGE_TAG}
    networks:
      - edge-net
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_PUBLIC_URL}
      WS_BASE_URL: ${WS_PUBLIC_URL}
    ports:
      - target: 80
        published: ${CUSTOMER_APP_PORT}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${CUSTOMER_APP_REPLICAS}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == edge
        preferences:
          - spread: node.labels.region

  driver-app:
    image: ${REGISTRY}/driver-app:${IMAGE_TAG}
    networks:
      - edge-net
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_PUBLIC_URL}
      WS_BASE_URL: ${WS_PUBLIC_URL}
    ports:
      - target: 80
        published: ${DRIVER_APP_PORT}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${DRIVER_APP_REPLICAS}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == edge
        preferences:
          - spread: node.labels.region

  api-gateway:
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG}
    networks:
      - edge-net
      - backend-net
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_ISSUER: ${AUTH_JWT_ISSUER}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3000
      RIDE_SERVICE_URL: http://ride-service:3000
      PRICING_SERVICE_URL: http://pricing-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      REVIEW_SERVICE_URL: http://review-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    ports:
      - target: 3000
        published: ${API_GATEWAY_PORT}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${API_GATEWAY_REPLICAS}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == edge
        preferences:
          - spread: node.labels.region

  pricing-service:
    image: ${REGISTRY}/pricing-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: &backend-env
      NODE_ENV: production
      PORT: 3000
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy: &app-service-deploy
      replicas: ${APP_SERVICE_REPLICAS}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == app
        preferences:
          - spread: node.labels.region

  payment-service:
    image: ${REGISTRY}/payment-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  booking-service:
    image: ${REGISTRY}/booking-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  auth-service:
    image: ${REGISTRY}/auth-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment:
      <<: *backend-env
      SERVICE_NAME: auth-service
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_NAME: ${POSTGRES_DB}
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: 6379
      AUTH_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:3000
      USER_SERVICE_BASE_URL: http://user-service:3000
      DRIVER_SERVICE_BASE_URL: http://driver-service:3000
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_ACTIVE_PRIVATE_KEY_PEM: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_PEM}
      AUTH_JWT_ACTIVE_PUBLIC_KEY_PEM: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_PEM}
    deploy: *app-service-deploy

  user-service:
    image: ${REGISTRY}/user-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment:
      <<: *backend-env
      AUTH_JWKS_URI: http://auth-service:3000/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
    deploy: *app-service-deploy

  review-service:
    image: ${REGISTRY}/review-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  driver-service:
    image: ${REGISTRY}/driver-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  notification-service:
    image: ${REGISTRY}/notification-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  ride-service:
    image: ${REGISTRY}/ride-service:${IMAGE_TAG}
    networks:
      - backend-net
      - broker-net
      - data-net
    environment: *backend-env
    deploy: *app-service-deploy

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    networks:
      - broker-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == data

  postgres:
    image: postgres:16-alpine
    networks:
      - data-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == data

  mongodb:
    image: mongo:7
    networks:
      - data-net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == data

  redis:
    image: redis:7-alpine
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""
    networks:
      - data-net
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    configs:
      - source: redis_conf
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.tier == data

networks:
  edge-net:
    driver: overlay
    attachable: true
  backend-net:
    driver: overlay
    attachable: true
  broker-net:
    driver: overlay
    attachable: true
  data-net:
    driver: overlay
    attachable: true

volumes:
  kafka_data:
  postgres_data:
  mongodb_data:
  redis_data:

configs:
  redis_conf:
    file: ./configs/redis/redis.conf
